<body>
    <div class="logo-details">
        <img src="/ASSETS/Logo.jpg" width="300px" Height="200px">
        <p><b>Value Each And Every Customer. We Are looking Forward To Provide a Better User Interface</b></p>
    </div>
    <div class="topnav">
        <i class="fa-solid fa-house" style="color: #ffffff;"></i>
        <a href="/">Home</a>
        <a href="/issues">Any Issues</a>
        <a href="/about">About</a>
    </div>
    <div class="bookingdetails">
        <h3>* Please make sure the information provided is correct</h3>
			<h2>Sender Details</h2>
            <form action="http://localhost:3000/bookingData" method="post" id="senderFormData" enctype="multipart/form-data" >
                <label for="sendername">Sender Name:</label>
                <input type="text" size="20" name="sendername" placeholder="Enter your Full Name" required>
                <label for="fromCity">From Place</label>
                <input type="text" size="20" name="fromCity" placeholder="Enter your city" required>
                <label for="senderPhoneNo">Sender PhoneNumber</label>
                <input type="tel" minlength="10" maxlength="10" size="10" name="phoneno" placeholder="Enter 10-digits Working Phone number" required>
                <label for="weight">Weight</label>
                <input type="number" id="w1" name="weight" maxlength="2" placeholder="Enter weight of Item" required>
                <label for="senderAddress">Address</label>
                <textarea rows="4" cols="15" name="senderAddress" placeholder="Enter Accurate Address For better Understanding Of Pick Up Location Of Item." required></textarea>
			<h2>Receiver Details</h2>
                <label for="receivername">Receiver Name:</label>
                <input type="text" size="20" name="receivername" placeholder="Enter The Name of Item Receiver" required>
                <label for="toCity">To Place</label>
                <input type="text" size="20" name="toCity" placeholder="Enter Destination city" required>
                <label for="receiverPhoneNo">Receiver PhoneNumber</label>
                <input type="tel" maxlength="10" size="10" name="receiverPhoneNo" placeholder="Enter 10-digits Working Phone number" required>
                <label for="receiverAddress">Address</label>
                <textarea rows="4" cols="15" name="receiverAddress" placeholder="Enter Accurate Address For better Understanding Of Delivery Location." required></textarea>
                <label for="productImage">Upload A Picture Of Item</label>
                <input type="file" class="img" name="productImage">
                <input type="text" name="status">
                <button type="submit">BOOK NOW</button>
            </form>
    </div>
</body>
</html>
